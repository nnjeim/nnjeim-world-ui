<VirtualHost *:80>
    ServerName world.bmbc.cloud
    DocumentRoot /var/www/html/public

    Header always unset X-Powered-By

    <LocationMatch "^/build/assets/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    <FilesMatch "\.(?:ico|jpe?g|png|svg|webmanifest)$">
        Header always set Cache-Control "public, max-age=604800"
    </FilesMatch>

    <FilesMatch "^(?:robots\.txt|sitemap\.xml)$">
        Header always set Cache-Control "public, max-age=3600"
    </FilesMatch>

    <Directory /var/www/html/public>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

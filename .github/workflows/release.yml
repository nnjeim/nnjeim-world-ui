name: Release

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the image and open the matching cluster-manifest pull request
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: world-ui-release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.bmbc.cloud
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: harbor.bmbc.cloud/library/world-ui
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest

      - name: Build and publish the AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: ${{ inputs.deploy }}
    needs: image
    runs-on: [self-hosted, world-ui-deploy]
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out application source
        uses: actions/checkout@v4

      - name: Check out cluster manifests
        uses: actions/checkout@v4
        with:
          repository: nnjeim/bmbc-cluster
          token: ${{ secrets.CLUSTER_REPO_TOKEN }}
          path: cluster

      - name: Prepare release metadata
        run: |
          echo "IMAGE_TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Update the manifest source of truth
        run: |
          sed -i -E "s#image: harbor.bmbc.cloud/library/world-ui:.*#image: harbor.bmbc.cloud/library/world-ui:${IMAGE_TAG}#" cluster/world-ui/world-ui.deployment.yaml

      - name: Apply and verify the release
        run: |
          kubectl apply -f cluster/world-ui/world-ui.deployment.yaml
          kubectl -n world rollout status deployment/world-ui --timeout=180s
          curl --fail --retry 5 --retry-delay 3 https://world.bmbc.cloud/up
          curl --fail --retry 5 --retry-delay 3 'https://world.bmbc.cloud/api/countries?search=rom' | jq -e '.success == true and .data[0].name == "Romania"'

      - name: Open the cluster-manifest pull request
        env:
          GH_TOKEN: ${{ secrets.CLUSTER_REPO_TOKEN }}
        run: |
          if git -C cluster diff --quiet -- world-ui/world-ui.deployment.yaml; then
            echo "Cluster manifest already points to this release."
            exit 0
          fi
          branch="world/release-${IMAGE_TAG}"
          git -C cluster config user.name "world-ui-release"
          git -C cluster config user.email "world-ui-release@users.noreply.github.com"
          git -C cluster switch -c "$branch"
          git -C cluster add world-ui/world-ui.deployment.yaml
          git -C cluster commit -m "Deploy World UI ${IMAGE_TAG}"
          git -C cluster push -u origin "$branch"
          gh pr create --repo nnjeim/bmbc-cluster --base main --head "$branch" --title "Deploy World UI ${IMAGE_TAG}" --body "Pins the World UI deployment to application commit ${GITHUB_SHA} after a successful production rollout."

name: Production smoke check

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the landing page
        run: |
          curl --fail --silent --show-error --retry 3 https://world.bmbc.cloud/ | grep -F 'Laravel Countries, States &amp; Cities Package — World'

      - name: Check the component library and sitemap
        run: |
          curl --fail --silent --show-error --retry 3 https://world.bmbc.cloud/components | grep -F 'Geographic UI components for Laravel and JavaScript.'
          curl --fail --silent --show-error --retry 3 https://world.bmbc.cloud/sitemap.xml | grep -F '<loc>https://world.bmbc.cloud/components</loc>'

      - name: Check the World API
        run: |
          curl --fail --silent --show-error --retry 3 'https://world.bmbc.cloud/api/countries?fields=iso2' | jq -e '.success == true and (.data | length) == 250'
          curl --fail --silent --show-error --head --retry 3 https://world.bmbc.cloud/api/countries | grep -iF 'x-robots-tag: noindex, nofollow'
